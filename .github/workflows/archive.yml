name: Verify frozen results
on:
  push:
    # This job checks frozen30, not the separate T2T experiment outputs.
    paths-ignore:
      - 'experiments/t2t/**'
      - 'bdlm_serving/methods/t2t/**'
  pull_request:
permissions:
  contents: read
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_results.py
      - run: python tools/render_report.py --check
      - run: python -m unittest discover -s tests -p test_diffusiongemma.py
      - run: python tools/diffusiongemma_results.py
