name: Verify frozen results
on: [push, pull_request]
permissions:
  contents: read
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_results.py
      - run: python -m unittest discover -s tests -p test_diffusiongemma.py
