<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Single-seat paired results" width="1060" height="640" viewBox="0 0 1060 640"><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="26" y="35" text-anchor="start" font-size="25" font-weight="bold" fill="#202b2a">What changes when exactly one Q row changes?</text><text x="26" y="62" text-anchor="start" font-size="15" font-weight="normal" fill="#202b2a">Frozen 30 per model · one matched-state substitution per eligible request · no substitution on the others</text><text x="26" y="104" text-anchor="start" font-size="19" font-weight="bold" fill="#202b2a">LLaDA 2.1   |   nominal Q = 4</text><text x="520" y="104" text-anchor="end" font-size="14" font-weight="bold" fill="#202b2a">Correct / 30</text><text x="665" y="104" text-anchor="end" font-size="14" font-weight="bold" fill="#202b2a">TPF</text><text x="824" y="104" text-anchor="end" font-size="14" font-weight="bold" fill="#202b2a">Token eff.</text><text x="991" y="104" text-anchor="end" font-size="14" font-weight="bold" fill="#202b2a">Actual Q/F</text><path d="M26,114H1030" stroke="#c4cdce"/><text x="26" y="142" text-anchor="start" font-size="16" font-weight="normal" fill="#263036">Optimus IBS4</text><text x="520" y="142" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">18</text><text x="665" y="142" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">1.434</text><text x="824" y="142" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">36.02%</text><text x="991" y="142" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">3.94</text><text x="26" y="173" text-anchor="start" font-size="16" font-weight="normal" fill="#263036">Optimus OBS4</text><text x="520" y="173" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">22</text><text x="665" y="173" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">1.541</text><text x="824" y="173" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">35.98%</text><text x="991" y="173" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">4.09</text><text x="26" y="204" text-anchor="start" font-size="16" font-weight="normal" fill="#263036">No predicted seat (neutral replay)</text><text x="520" y="204" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">25</text><text x="665" y="204" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">3.338</text><text x="824" y="204" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">19.97%</text><text x="991" y="204" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">12.13</text><text x="26" y="235" text-anchor="start" font-size="16" font-weight="normal" fill="#263036">One swap: uniform old row</text><text x="520" y="235" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">25</text><text x="665" y="235" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">3.331</text><text x="824" y="235" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">19.85%</text><text x="991" y="235" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">12.16</text><text x="26" y="266" text-anchor="start" font-size="16" font-weight="bold" fill="#006b5f">One swap: predicted old row</text><text x="520" y="266" text-anchor="end" font-size="16" font-weight="bold" fill="#006b5f">25</text><text x="665" y="266" text-anchor="end" font-size="16" font-weight="bold" fill="#006b5f">3.334</text><text x="824" y="266" text-anchor="end" font-size="16" font-weight="bold" fill="#006b5f">19.92%</text><text x="991" y="266" text-anchor="end" font-size="16" font-weight="bold" fill="#006b5f">12.13</text><text x="26" y="297" text-anchor="start" font-size="16" font-weight="normal" fill="#263036">Repeated swaps: original online policy</text><text x="520" y="297" text-anchor="end" font-size="16" font-weight="n