3036">35.31</text><text x="26" y="456" text-anchor="start" font-size="16" font-weight="normal" fill="#263036">No predicted seat (neutral replay)</text><text x="520" y="456" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">28</text><text x="665" y="456" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">7.980</text><text x="824" y="456" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">13.00%</text><text x="991" y="456" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">58.93</text><text x="26" y="487" text-anchor="start" font-size="16" font-weight="normal" fill="#263036">One swap: uniform old row</text><text x="520" y="487" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">28</text><text x="665" y="487" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">7.986</text><text x="824" y="487" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">13.02%</text><text x="991" y="487" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">59.36</text><text x="26" y="518" text-anchor="start" font-size="16" font-weight="bold" fill="#006b5f">One swap: predicted old row</text><text x="520" y="518" text-anchor="end" font-size="16" font-weight="bold" fill="#006b5f">28</text><text x="665" y="518" text-anchor="end" font-size="16" font-weight="bold" fill="#006b5f">8.165</text><text x="824" y="518" text-anchor="end" font-size="16" font-weight="bold" fill="#006b5f">13.05%</text><text x="991" y="518" text-anchor="end" font-size="16" font-weight="bold" fill="#006b5f">60.09</text><text x="26" y="549" text-anchor="start" font-size="16" font-weight="normal" fill="#263036">Repeated swaps: original online policy</text><text x="520" y="549" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">29</text><text x="665" y="549" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">8.111</text><text x="824" y="549" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">12.97%</text><text x="991" y="549" text-anchor="end" font-size="16" font-weight="normal" fill="#263036">60.02</text><path d="M26,562H1030" stroke="#c4cdce"/><text x="26" y="598" text-anchor="start" font-size="13" font-weight="normal" fill="#202b2a">TPF = mean(request tokens / forwards); efficiency = pooled tokens / physical Q. All generation closure work is charged.</text><text x="26" y="620" text-anchor="start" font-size="13" font-weight="normal" fill="#202b2a">The final row repeatedly applies the selector; it is not a single intervention. TPF is not wall-clock throughput.</text></g></svg>